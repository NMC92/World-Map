<!DOCTYPE html>
	 <html lang="en">
<!--[if lt IE 7]>  <html class = "no-js lt-ie9 lt-ie8 lt-ie7">  <![endif]-->
     <!--[if IE 7]>  <html class = "no-js lt-ie9 lt-ie8">  <![endif]-->
     <!--[if IE 8]>  <html class = "no-js lt-ie9">  <![endif]-->
     <!--[if gt IE 8]>  <html class="no-js">  <![endif]-->
	 <head>
     <meta charset="utf-8">
     <meta http-equiv="X-UA-Compatible" content="IE=edge">
     <meta name="description" content="">
     <meta name="viewport" content="width=device-width, initial-scale=1">
     <meta name="theme-color" content="#aad3df">
	 <link rel="manifest" href="manifest.json">
	 <link rel="apple-touch-icon" href="icon-192.png">
	 <link rel="shortcut icon" href="#">
	 <link rel="stylesheet" href="Earth.css">
     <title>Earth</title>
	 <script src="jquery-3.5.1.min.js"></script>
	 <script src="papaparse.min.js"></script>
	 <script type="module" src="Earth.js" defer></script>
	 </head>
	 <body>
		<img id="loader" src="Loading.gif" alt="" class="Undefined">
		<progress id="progress-bar" class="Undefined" value="0" max="100"></progress>
		<div id="progress-value" class="Undefined">0%</div>
		<div id="image-container" style="position: relative;"></div>
		<object id="svg-map" type="image/svg+xml" data="Earth.svg"></object>
		<div>
		  <span id="span"></span>
		  <br>
		  <br>
		  <button type="button" id="reset" class="Undefined">Reset</button>
		  <button type="button" id="back" class="Undefined">Back</button>
		  <button type="button" id="locate" title="Find me: show where you are and open that parish">Locate</button>
		  <button type="button" id="gps-follow" aria-pressed="false" title="Follow me: move the view when you enter another parish">Follow: off</button>
		  <!-- The three filters sit on one line: a <br> between them would add the
		       900px control line-height as a visible gap between the boxes. The
		       wrapper is a block, not a <br>, because the stylesheet hides this row's
		       <br>s on a phone — and then the boxes would share the button line. -->
		  <div><input type="checkbox" id="hide-no-image" title="Hide pins without pictures" aria-label="Hide pins without pictures"><input type="checkbox" id="highlights-only" title="Highlights only (hide service and institution pins)" aria-label="Highlights only (hide service and institution pins)"><input type="checkbox" id="only-no-image" title="Only pins without pictures (photo backlog)" aria-label="Only pins without pictures (photo backlog)"></div>
		  <!-- The same for the status line: its own block, so it never continues the
		       checkbox row on a phone. The nearest-pin line is a second block under it
		       (see gpsStatus); empty, it takes no space. -->
		  <div><span id="gps-status" aria-live="polite"></span></div>
		  <div><span id="gps-nearest" aria-live="polite"></span></div>
		  <span id="container"></span>
		  <!-- Hidden until a new service worker takes over; see Earth.js. -->
		  <span id="update-hint" hidden>A new version is ready.</span>
		  <button type="button" id="reload" hidden>Reload</button>
		</div>
	</body>
</html>
